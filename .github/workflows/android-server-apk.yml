name: Android Server APK

# Builds the PencariMovie Server APK (android/pencarimovie-server) and publishes
# it to the rolling `apk-server-latest` release, so the in-app updater always has
# a stable version.json plus per-ABI APKs.
#
# Kept SEPARATE from android-apk.yml, which publishes the legacy
# pencarimovie.downloader app on the `apk-latest` release. The two feeds never
# share a tag or an asset, so changing one never disturbs the other.
#
# version.json (read by UpdateChecker) carries the applicationId
# (com.pencarimovie.server) and a per-ABI `apks` map, so the app downloads the
# APK matching the device ABI (falling back to `universal`) and refuses anything
# built for a different app.
#
# Triggers:
#   - manual run (workflow_dispatch)
#   - push to main/master touching this project or this workflow

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName (semver, e.g. 1.0.1). Defaults to the value in app/build.gradle."
        required: false
        default: ""
  push:
    branches: [main, master]
    paths:
      - "android/pencarimovie-server/**"
      - ".github/workflows/android-server-apk.yml"

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/pencarimovie-server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # `tools` no longer exists in the SDK repo, so install only
          # platform-tools here; the platform is added in the next step.
          packages: "platform-tools"

      # compileSdkVersion=36 (see gradle.properties) is not installed by
      # setup-android by default, and the build fails without it.
      - name: Install SDK platform 36 and build-tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-server-${{ runner.os }}-${{ hashFiles('android/pencarimovie-server/**/*.gradle', 'android/pencarimovie-server/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-server-${{ runner.os }}-

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail

          # Relative to the job's working-directory (android/pencarimovie-server).
          GRADLE=app/build.gradle

          # versionName: manual input > the value in app/build.gradle.
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            NAME="${{ github.event.inputs.version_name }}"
          else
            NAME=$(grep -oP 'versionName .*: "\K[^"]+' "$GRADLE" | head -n 1)
          fi

          # Accept a leading "v" (e.g. "v1.0.1").
          NAME="${NAME#v}"

          if ! [[ "$NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::versionName '$NAME' is not valid semver"
            exit 1
          fi

          # Baseline versionCode from app/build.gradle.
          CODE=$(grep -oP 'versionCode .*: \K[0-9]+' "$GRADLE" | head -n 1)
          if ! [[ "$CODE" =~ ^[1-9][0-9]*$ ]]; then
            CODE=1
          fi

          # Monotonic versionCode derived from semver (e.g. 1.0.1 -> 10001) so a
          # new release always outranks the previous install.
          if [[ "$NAME" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            SEMVER_CODE=$(( BASH_REMATCH[1] * 10000 + BASH_REMATCH[2] * 100 + BASH_REMATCH[3] ))
            if [ "$SEMVER_CODE" -gt "$CODE" ]; then
              CODE="$SEMVER_CODE"
            fi
          fi

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$NAME versionCode=$CODE"

      # ABI-split APKs are only usable when the TDLib native library and the
      # signing key are present. libtdjni.so is 37 MB and deliberately NOT in
      # the repository (.gitignore), so a runner cannot build a working APK
      # until it is supplied (e.g. as a release asset + download step here).
      # Without this guard the workflow would publish APKs that die with
      # UnsatisfiedLinkError on start and overwrite the working rolling feed.
      - name: Preflight (TDLib runtime + signing key)
        run: |
          set -euo pipefail
          missing=0
          for abi in arm64-v8a armeabi-v7a; do
            if [ ! -f "app/src/main/jniLibs/$abi/libtdjni.so" ]; then
              echo "::error::app/src/main/jniLibs/$abi/libtdjni.so is missing — supply the TDLib runtime before releasing."
              missing=1
            fi
          done
          if [ ! -f app/release-key.jks ]; then
            echo "::error::app/release-key.jks is missing — the release APK cannot be signed."
            missing=1
          fi
          [ "$missing" -eq 0 ] || exit 1
          echo "TDLib runtime and signing key present."

      - name: Build release APKs
        env:
          TERMUX_APK_VERSION_TAG: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          # The project splits per ABI (armeabi-v7a, arm64-v8a) and also emits a
          # universal APK. Quote each -P so a dotted versionName is never split.
          ./gradlew :app:assembleRelease \
            "-PversionNameOverride=${{ steps.ver.outputs.name }}" \
            "-PversionCodeOverride=${{ steps.ver.outputs.code }}" \
            --no-daemon --stacktrace

      - name: Stage APKs and write version.json
        id: apk
        run: |
          set -euo pipefail

          OUT="$GITHUB_WORKSPACE/dist-apk-server"
          mkdir -p "$OUT"
          REL=app/build/outputs/apk/release

          # Stable, arch-suffixed asset names so the download URLs never change
          # between releases (assets are replaced with --clobber).
          for abi in arm64-v8a armeabi-v7a universal; do
            SRC=$(find "$REL" -name "*_${abi}.apk" -type f | head -n 1)
            if [ -z "$SRC" ]; then
              echo "::error::No ${abi} APK produced"
              find app/build/outputs -type f || true
              exit 1
            fi
            DEST="$OUT/pencarimovie-server_release_${abi}.apk"
            cp "$SRC" "$DEST"
            sha256sum "$DEST" | cut -d' ' -f1 > "$DEST.sha256"
            echo "Staged $DEST ($(du -h "$DEST" | cut -f1))"
          done

          A64=$(cut -d' ' -f1 < "$OUT/pencarimovie-server_release_arm64-v8a.apk.sha256")
          A32=$(cut -d' ' -f1 < "$OUT/pencarimovie-server_release_armeabi-v7a.apk.sha256")
          UNI=$(cut -d' ' -f1 < "$OUT/pencarimovie-server_release_universal.apk.sha256")
          BASE="https://github.com/${{ github.repository }}/releases/download/apk-server-latest"

          cat > "$OUT/version.json" <<EOF
          {
            "applicationId": "com.pencarimovie.server",
            "versionName": "${{ steps.ver.outputs.name }}",
            "versionCode": ${{ steps.ver.outputs.code }},
            "apks": {
              "arm64-v8a": { "url": "$BASE/pencarimovie-server_release_arm64-v8a.apk", "sha256": "$A64" },
              "armeabi-v7a": { "url": "$BASE/pencarimovie-server_release_armeabi-v7a.apk", "sha256": "$A32" },
              "universal": { "url": "$BASE/pencarimovie-server_release_universal.apk", "sha256": "$UNI" }
            },
            "apkUrl": "$BASE/pencarimovie-server_release_universal.apk",
            "sha256": "$UNI",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${GITHUB_SHA::7}"
          }
          EOF
          cat "$OUT/version.json"

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pencarimovie-server-apk-${{ steps.ver.outputs.name }}
          path: |
            ${{ github.workspace }}/dist-apk-server/*.apk
            ${{ github.workspace }}/dist-apk-server/*.sha256
            ${{ github.workspace }}/dist-apk-server/version.json
          if-no-files-found: error

      # Rolling release: always the same tag, so the public download link (and the
      # updater's version.json URL) is stable. --latest=false is essential: the
      # server tarball OTA resolves /releases/latest and must keep pointing at the
      # real server release, not this rolling APK feed.
      - name: Publish to apk-server-latest
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="apk-server-latest"
          TITLE="PencariMovie Server - Android APK"
          NOTES="Rolling Android APK build for com.pencarimovie.server.

          - versionName: \`${{ steps.ver.outputs.name }}\`
          - versionCode: \`${{ steps.ver.outputs.code }}\`
          - commit: \`${GITHUB_SHA::7}\`
          - built: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Version-specific builds are not published here; the app polls
          version.json from this release."

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest=false
          else
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest=false
          fi

          gh release upload "$TAG" \
            "$GITHUB_WORKSPACE/dist-apk-server/pencarimovie-server_release_arm64-v8a.apk" \
            "$GITHUB_WORKSPACE/dist-apk-server/pencarimovie-server_release_armeabi-v7a.apk" \
            "$GITHUB_WORKSPACE/dist-apk-server/pencarimovie-server_release_universal.apk" \
            "$GITHUB_WORKSPACE/dist-apk-server/version.json" \
            --clobber
