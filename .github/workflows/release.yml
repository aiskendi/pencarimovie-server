name: Release Builder & Docker Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.2.3)"
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release tag
        id: vars
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "$TAG" > .release-tag

      - name: Setup PHP & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, curl, openssl, fileinfo, zip
          tools: composer

      - name: Install Composer dependencies (bundle vendor/)
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch official FrankenPHP release binaries
        run: |
          mkdir -p bin dist
          FRANKEN_TAG=$(curl -s https://api.github.com/repos/php/frankenphp/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' || echo "v1.4.4")
          echo "Latest FrankenPHP tag: $FRANKEN_TAG"

          TARGETS=(
            "frankenphp-windows-x86_64.zip"
            "frankenphp-linux-x86_64"
            "frankenphp-linux-x86_64-gnu"
            "frankenphp-linux-x86_64-mimalloc"
            "frankenphp-linux-aarch64"
            "frankenphp-linux-aarch64-gnu"
            "frankenphp-mac-arm64"
            "frankenphp-mac-x86_64"
          )

          for t in "${TARGETS[@]}"; do
            echo "Downloading $t..."
            curl -fsSL "https://github.com/php/frankenphp/releases/download/${FRANKEN_TAG}/$t" -o "$t"
          done

      - name: Package all release targets (matching build-release.bat)
        run: |
          chmod +x scripts/*.sh
          bash scripts/build-release.sh

          # Package standalone universal server (pencarimovie-server.tar.gz)
          mkdir -p dist/.build-tmp/pencarimovie-server
          cp -r public backend.php index.php router.php Caddyfile install.sh install-termux.sh start.sh start-termux.sh restart.sh restart-termux.sh stop.sh pencarimovie-linux.sh pencarimovie-termux.sh pencarimovie-docker.sh warmup-ipc.php package.json README.md LICENSE SECURITY.md dist/.build-tmp/pencarimovie-server/ 2>/dev/null || true
          mkdir -p dist/.build-tmp/pencarimovie-server/bin dist/.build-tmp/pencarimovie-server/storage
          cp bin/php.ini.unix dist/.build-tmp/pencarimovie-server/bin/php.ini 2>/dev/null || true
          cp bin/php dist/.build-tmp/pencarimovie-server/bin/php 2>/dev/null || true

          # Bundle arm64 ffmpeg for Termux/proot standalone server
          FFMPEG_URL="https://github.com/acoustid/ffmpeg-build/releases/download/v8.1.2-1/ffmpeg-8.1.2-audio-encode-arm64-linux-gnu.tar.gz"
          FFMPEG_TMP=$(mktemp -d)
          curl -fsSL "$FFMPEG_URL" -o "$FFMPEG_TMP/ffmpeg.tar.gz" && tar -xzf "$FFMPEG_TMP/ffmpeg.tar.gz" -C "$FFMPEG_TMP"
          cp "$FFMPEG_TMP/ffmpeg" dist/.build-tmp/pencarimovie-server/bin/ffmpeg 2>/dev/null || true
          chmod +x dist/.build-tmp/pencarimovie-server/bin/ffmpeg 2>/dev/null || true
          rm -rf "$FFMPEG_TMP"

          # Bundle vendor and release tag
          if [ -d "vendor" ]; then cp -r vendor dist/.build-tmp/pencarimovie-server/; fi
          if [ -f ".release-tag" ]; then cp .release-tag dist/.build-tmp/pencarimovie-server/; fi
          tar -C dist/.build-tmp -czf dist/pencarimovie-server.tar.gz pencarimovie-server
          rm -rf dist/.build-tmp

          # Ensure only tar.gz and zip archives are in dist/ (scripts stay in main)
          rm -f dist/*.sh dist/*.bat dist/*.ps1 dist/*.apk

          echo "Release archives in dist/:"
          ls -lh dist/

      - name: Build and push multi-arch Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ env.TAG }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.tag != ''
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
