name: Release Builder & Docker Publish

# Manual only. This workflow publishes the server tarballs that the in-app
# OTA downloads, and it also pushes a multi-arch Docker image. Running it on
# every push to main meant a release was cut for every commit, and a stray
# `v*` tag could publish a release that shadows /releases/latest.
#
# To cut a release: Actions -> "Release Builder & Docker Publish" -> Run
# workflow, and supply the tag (e.g. v2.4.7). Leave the tag empty to build
# and publish the Docker image only, without creating a GitHub release.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v2.4.7). Leave empty to build the Docker image only."
        required: false
        default: ""

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set release tag
        id: vars
        run: |
          set -euo pipefail
          # Trim surrounding whitespace: a stray leading/trailing space in the
          # workflow_dispatch input (e.g. " v2.3.5") would otherwise fail the
          # version regex below and abort the whole release.
          TAG="$(printf '%s' "${{ github.event.inputs.tag }}" | tr -d '[:space:]')"

          if [ -n "$TAG" ]; then
            # A tag was supplied: validate it before it is used as a release
            # name. A bare "latest" would collide with the /releases/latest
            # endpoint that the in-app OTA resolves.
            if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              echo "::error::Tag '$TAG' must look like v1.2.3"
              exit 1
            fi
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            # No tag: build and push the Docker image only, no GitHub release.
            TAG="latest"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "No tag supplied — building the Docker image only."
          fi

          echo "TAG=$TAG" >> "$GITHUB_ENV"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "$TAG" > .release-tag

      - name: Setup PHP & Composer
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, curl, openssl, fileinfo, zip
          tools: composer

      - name: Install Composer dependencies (bundle vendor/)
        run: |
          composer install --no-dev --prefer-dist --optimize-autoloader --no-interaction

      - name: Apply MadelineProto IPC patch to vendor/ and verify
        run: |
          set -euo pipefail
          # cweagans/composer-patches normally applies this during composer
          # install, but it is skipped when the patch is already applied in the
          # dev tree or when composer.lock predates the patch change. A release
          # built from an unpatched vendor/ ships the old getSlow()
          # (Magic::$isIpcWorker || PHP_OS_FAMILY === 'Windows'), which forces a
          # full-mode boot on Windows and produces the
          # "It seems like the session is busy." / "Could not connect to
          # MadelineProto" storm on a fresh install. Apply it explicitly and
          # fail the build if the patched form is not present.
          PATCH="$PWD/patches/madelineproto-windows-ipc.patch"
          if [ -f "$PATCH" ]; then
            # Apply from the package root with -p1 so the a/src/... paths in the
            # patch resolve against vendor/danog/madelineproto. Using an absolute
            # patch path avoids the relative-path mistakes that made the earlier
            # `cd vendor/danog/madelineproto && git apply ../../../../patches/...`
            # fail with "can't open patch".
            git -C vendor/danog/madelineproto apply --recount --whitespace=nowarn "$PATCH" || true
          fi

          # Use PHP for the in-place rewrite: it avoids all shell/sed escaping
          # pitfalls with `$`, `\` and quotes in the target line.
          php -r '
            $p = "vendor/danog/madelineproto/src/Settings/Ipc.php";
            if (!is_file($p)) { fwrite(STDERR, "missing $p\n"); exit(1); }
            $c = file_get_contents($p);
            $old = "return Magic::\$isIpcWorker || \\PHP_OS_FAMILY === \x27Windows\x27;";
            $new = "return Magic::\$isIpcWorker || !empty(\$GLOBALS[\x27FD_FORCE_FULL_BOOT\x27]);";
            if (str_contains($c, $old)) {
                $c = str_replace($old, $new, $c);
                file_put_contents($p, $c);
                echo "Rewrote getSlow() in $p\n";
            }
            if (!str_contains($c, "FD_FORCE_FULL_BOOT")) {
                fwrite(STDERR, "ERROR: $p does not contain the patched getSlow() form\n");
                exit(1);
            }
            echo "Verified: $p has the patched getSlow()\n";
          '

      - name: Run Scenario & Integration Verification Tests
        run: |
          set -euo pipefail
          # Start background PHP server for testing
          php -S 127.0.0.1:8088 router.php > /tmp/test-server.log 2>&1 &
          SERVER_PID=$!

          # Wait for server to become responsive
          for i in {1..30}; do
            if curl -s http://127.0.0.1:8088/manifest.json >/dev/null; then
              break
            fi
            sleep 0.5
          done

          # Run scenario verification
          python3 - << 'EOF'
          import urllib.request
          import json
          import time
          import sys

          BASE_URL = "http://127.0.0.1:8088"

          def test_endpoint(name, url, check_fn):
              print(f"Testing {name} ({url})...", end=" ", flush=True)
              try:
                  t0 = time.time()
                  req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                  with urllib.request.urlopen(req, timeout=15) as resp:
                      status = resp.status
                      body = resp.read().decode('utf-8')
                      elapsed = round(time.time() - t0, 2)
                      data = json.loads(body)
                      ok, msg = check_fn(data)
                      if ok:
                          print(f"PASSED ({elapsed}s) - {msg}")
                          return True
                      else:
                          print(f"FAILED ({elapsed}s) - {msg}")
                          return False
              except Exception as e:
                  print(f"ERROR: {e}")
                  return False

          scenarios = [
              ("Manifest", f"{BASE_URL}/manifest.json", lambda d: (bool(d.get("id") and "catalogs" in d), f"id={d.get('id')}")),
              ("Catalog Top Movies", f"{BASE_URL}/catalog/movie/top.json", lambda d: (len(d.get("metas", [])) > 0, f"metas={len(d.get('metas', []))}")),
              ("Catalog Other Files", f"{BASE_URL}/catalog/other/pm_files_year/genre=2026.json", lambda d: (len(d.get("metas", [])) > 0, f"metas={len(d.get('metas', []))}")),
              ("Direct File Stream (pm_file_)", f"{BASE_URL}/stream/other/pm_file_4xWhGL.json", lambda d: (any("url" in s for s in d.get("streams", [])), f"streams={len(d.get('streams', []))}")),
              ("Direct File Stream (pm:file:)", f"{BASE_URL}/stream/movie/pm:file:rvbJeR.json", lambda d: (any("url" in s for s in d.get("streams", [])), f"streams={len(d.get('streams', []))}")),
              ("Series Episode Stream", f"{BASE_URL}/stream/series/pm:post:9000021393:1:25.json", lambda d: (any("url" in s for s in d.get("streams", [])), f"streams={len(d.get('streams', []))}")),
              ("Meta Other", f"{BASE_URL}/meta/other/pm_file_4xWhGL.json", lambda d: (bool(d.get("meta")), f"meta={bool(d.get('meta'))}")),
              ("Meta Series Post", f"{BASE_URL}/meta/series/pm:post:9000021393.json", lambda d: (bool(d.get("meta")), f"meta={bool(d.get('meta'))}")),
              ("IMDb Movie Stream", f"{BASE_URL}/stream/movie/tt1375666.json", lambda d: ("streams" in d, f"streams={len(d.get('streams', []))}")),
          ]

          failed = 0
          for name, url, check_fn in scenarios:
              if not test_endpoint(name, url, check_fn):
                  failed += 1

          if failed > 0:
              print(f"\n{failed} scenario tests failed!")
              sys.exit(1)
          print("\nAll scenario tests passed!")
          EOF

          kill $SERVER_PID || true

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Fetch official FrankenPHP release binaries
        run: |
          mkdir -p bin dist
          FRANKEN_TAG=$(curl -s https://api.github.com/repos/php/frankenphp/releases/latest | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/' || echo "v1.4.4")
          echo "Latest FrankenPHP tag: $FRANKEN_TAG"

          TARGETS=(
            "frankenphp-windows-x86_64.zip"
            "frankenphp-linux-x86_64"
            "frankenphp-linux-x86_64-gnu"
            "frankenphp-linux-x86_64-mimalloc"
            "frankenphp-linux-aarch64"
            "frankenphp-linux-aarch64-gnu"
            "frankenphp-mac-arm64"
            "frankenphp-mac-x86_64"
          )

          for t in "${TARGETS[@]}"; do
            echo "Downloading $t..."
            curl -fsSL "https://github.com/php/frankenphp/releases/download/${FRANKEN_TAG}/$t" -o "$t"
          done

      - name: Package all release targets (matching build-release.bat)
        run: |
          chmod +x scripts/*.sh
          bash scripts/build-release.sh

          # Package standalone universal server (pencarimovie-server.tar.gz)
          mkdir -p dist/.build-tmp/pencarimovie-server
          cp -r public backend.php index.php router.php Caddyfile install.sh install-termux.sh start.sh start-termux.sh restart.sh restart-termux.sh stop.sh pencarimovie-linux.sh pencarimovie-termux.sh pencarimovie-docker.sh package.json README.md LICENSE SECURITY.md dist/.build-tmp/pencarimovie-server/ 2>/dev/null || true
          # NOTE: composer.phar / composer-setup.php are intentionally NOT shipped.
          # install.sh falls back to a global `composer` when vendor/ is absent.
          mkdir -p dist/.build-tmp/pencarimovie-server/bin dist/.build-tmp/pencarimovie-server/storage
          cp bin/php.ini.unix dist/.build-tmp/pencarimovie-server/bin/php.ini 2>/dev/null || true
          cp bin/php dist/.build-tmp/pencarimovie-server/bin/php 2>/dev/null || true
          # NOTE: storage/catalog_settings.json is intentionally NOT shipped.
          # It is per-user state (enabled catalogs, upstream manifests, stream
          # filters). Shipping the developer's copy would override the built-in
          # defaults in fd_load_catalog_settings() — including the default
          # AIOMetadata upstream manifest — on every fresh install.
          cp storage/.gitkeep storage/config.example.json dist/.build-tmp/pencarimovie-server/storage/ 2>/dev/null || true

          # Bundle vendor, patches and release tag
          if [ -d "vendor" ]; then cp -r vendor dist/.build-tmp/pencarimovie-server/; fi
          if [ -d "patches" ]; then cp -r patches dist/.build-tmp/pencarimovie-server/; fi
          if [ -f ".release-tag" ]; then cp .release-tag dist/.build-tmp/pencarimovie-server/; fi
          tar -C dist/.build-tmp -czf dist/pencarimovie-server.tar.gz pencarimovie-server
          rm -rf dist/.build-tmp

          # Verify Windows package integrity (must contain bin/php.ini with extension=fileinfo)
          if [ -f "dist/pencarimovie-downloader-windows-x86_64.zip" ]; then
            if ! unzip -l dist/pencarimovie-downloader-windows-x86_64.zip | grep -q "bin/php.ini"; then
              echo "ERROR: dist/pencarimovie-downloader-windows-x86_64.zip is missing bin/php.ini!"
              exit 1
            fi
            echo "Verified: dist/pencarimovie-downloader-windows-x86_64.zip contains bin/php.ini"
          fi

          # Ensure only tar.gz, zip archives, and logo asset are in dist/ (scripts stay in main)
          rm -f dist/*.sh dist/*.bat dist/*.ps1 dist/*.apk
          cp public/logo.png dist/logo.png 2>/dev/null || true

          echo "Release archives in dist/:"
          ls -lh dist/

      - name: Build and push multi-arch Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ env.TAG }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        # Only when a tag was supplied. Without one this run is a Docker-only
        # build and must not create a release.
        if: steps.vars.outputs.publish == 'true'
        with:
          tag_name: ${{ env.TAG }}
          files: |
            dist/*.tar.gz
            dist/*.zip
            dist/*.zip.sha256
            dist/logo.png
          draft: false
          prerelease: false
          generate_release_notes: true

      - name: Display Next Version and Release Summary
        if: always()
        env:
          TAG: ${{ env.TAG || 'latest' }}
          PUBLISHED: ${{ steps.vars.outputs.publish || 'false' }}
        run: |
          set -euo pipefail

          php -r '
            $tag = getenv("TAG");
            $published = getenv("PUBLISHED") === "true";

            $next = "v1.0.0";
            if (preg_match("/^v?(\d+)\.(\d+)\.(\d+)/", $tag, $m)) {
                $major = $m[1];
                $minor = $m[2];
                $patch = (int)$m[3] + 1;
                $next = "v{$major}.{$minor}.{$patch}";
            } else {
                // Fetch highest git tag if current run was docker-only
                $output = shell_exec("git tag -l \"v*\" --sort=-v:refname | head -n 1");
                $latestTag = trim($output ?: "");
                if (preg_match("/^v?(\d+)\.(\d+)\.(\d+)/", $latestTag, $m)) {
                    $next = "v{$m[1]}.{$m[2]}." . ((int)$m[3] + 1);
                }
            }

            echo "::notice title=Next Recommended Release Tag::Next release version to use: " . $next . "\n";

            $summary = "# 🚀 Release Build & Docker Publish Summary\n\n";
            if ($published) {
                $summary .= "- **Published Release Tag**: \`" . $tag . "\`\n";
                $summary .= "- **Next Version To Use**: \`" . $next . "\` 🎉\n";
                $summary .= "- **Docker Image**: \`ghcr.io/" . getenv("GITHUB_REPOSITORY") . ":" . $tag . "\`\n\n";
                $summary .= "> 💡 **Next time you run this workflow, supply \`" . $next . "\` in the tag input.**\n";
            } else {
                $summary .= "- **Docker Image**: \`ghcr.io/" . getenv("GITHUB_REPOSITORY") . ":latest\`\n";
                $summary .= "- **Next Version To Use (when cutting a release)**: \`" . $next . "\`\n\n";
                $summary .= "> ℹ️ *No release tag was provided; built and published Docker image only.*\n";
            }

            file_put_contents(getenv("GITHUB_STEP_SUMMARY"), $summary, FILE_APPEND);
          '
