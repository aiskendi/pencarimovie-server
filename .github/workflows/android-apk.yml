name: Android APK

# Builds the PencariMovie Downloader APK and publishes it to the rolling
# `apk-latest` release, so the download link never goes stale.
#
# Triggers:
#   - push to main/master touching the Android project or this workflow
#   - manual run (workflow_dispatch)
#   - tag push (v*) so a versioned APK ships alongside the server tarball
#
# The APK is signed with the keystores committed under
# android/termux-app-fork/app/ (testkey_untrusted.jks for debug,
# release-key.jks for release), so no signing secrets are required.

on:
  push:
    branches: [main, master]
    paths:
      - "android/termux-app-fork/**"
      - ".github/workflows/android-apk.yml"
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version_name:
        description: "Override versionName (semver, e.g. 2.3.3). Defaults to the tag or 0.0.0-dev."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android/termux-app-fork

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action defaults to `tools platform-tools`, but the `tools`
          # package no longer exists in the SDK repository and sdkmanager
          # fails with "Failed to find package 'tools'". Install only what
          # the build needs; platform 36 is added in the next step.
          packages: "platform-tools"

      # compileSdkVersion=36 (see gradle.properties) is not installed by
      # setup-android by default, and the build fails without it.
      - name: Install SDK platform 36 and build-tools
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/termux-app-fork/**/*.gradle', 'android/termux-app-fork/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Resolve version
        id: ver
        run: |
          set -euo pipefail

          # Priority: manual input > git tag > fallback.
          if [ -n "${{ github.event.inputs.version_name }}" ]; then
            NAME="${{ github.event.inputs.version_name }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            NAME="${GITHUB_REF#refs/tags/v}"
          else
            NAME="0.0.0-dev"
          fi

          # versionName must be valid semver (app/build.gradle validates it).
          # A tag like v2.3.3 -> 2.3.3 is already valid; anything else gets a
          # numeric fallback so the build never fails on a malformed tag.
          if ! [[ "$NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::warning::'$NAME' is not valid semver; falling back to 0.0.0-dev"
            NAME="0.0.0-dev"
          fi

          # versionCode must be a monotonically increasing integer. Derive it
          # from the semver parts so it tracks versionName automatically.
          MAJOR=$(echo "$NAME" | cut -d. -f1)
          MINOR=$(echo "$NAME" | cut -d. -f2)
          PATCH=$(echo "$NAME" | cut -d. -f3 | sed 's/[-+].*//')
          CODE=$(( MAJOR * 10000 + MINOR * 100 + PATCH ))

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$NAME versionCode=$CODE"

      - name: Build release APK
        env:
          TERMUX_APK_VERSION_TAG: ${{ steps.ver.outputs.name }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          # Quote each -P so a dotted versionName is never word-split by the shell.
          ./gradlew :app:assembleRelease \
            "-PversionNameOverride=${{ steps.ver.outputs.name }}" \
            "-PversionCodeOverride=${{ steps.ver.outputs.code }}" \
            --no-daemon --stacktrace

      - name: Collect APK
        id: apk
        run: |
          set -euo pipefail
          SRC=$(find app/build/outputs/apk/release -name '*.apk' -type f | head -n 1)
          if [ -z "$SRC" ]; then
            echo "::error::No release APK produced"
            find app/build/outputs -type f || true
            exit 1
          fi
          mkdir -p ../../dist-apk
          # Stable, arch-suffixed name so the download URL never changes.
          DEST="../../dist-apk/pencarimovie_arm64-v8a.apk"
          cp "$SRC" "$DEST"
          echo "path=$DEST" >> "$GITHUB_OUTPUT"
          ls -lh "$DEST"
          sha256sum "$DEST" | tee "$DEST.sha256"

          # version.json is what the app polls to detect an update. It is a
          # separate asset so the check is a tiny request, not a 15 MB download.
          cat > ../../dist-apk/version.json <<EOF
          {
            "versionName": "${{ steps.ver.outputs.name }}",
            "versionCode": ${{ steps.ver.outputs.code }},
            "apkUrl": "https://github.com/${{ github.repository }}/releases/download/apk-latest/pencarimovie_arm64-v8a.apk",
            "sha256": "$(sha256sum "$DEST" | cut -d' ' -f1)",
            "builtAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "commit": "${GITHUB_SHA::7}"
          }
          EOF
          cat ../../dist-apk/version.json

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pencarimovie-apk-${{ steps.ver.outputs.name }}
          path: |
            dist-apk/*.apk
            dist-apk/*.sha256
            dist-apk/version.json
          if-no-files-found: error

      # Rolling release: always the same tag, so the public download link is
      # stable. `--clobber` replaces the previous asset.
      - name: Publish to apk-latest
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          TAG="apk-latest"
          TITLE="PencariMovie Downloader - Android APK"
          NOTES="Rolling Android APK build.

          - versionName: \`${{ steps.ver.outputs.name }}\`
          - versionCode: \`${{ steps.ver.outputs.code }}\`
          - commit: \`${GITHUB_SHA::7}\`
          - built: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          Install over an existing copy signed with the same key. Uninstalling
          clears the Termux bootstrap and the MadelineProto session in \`storage/\`."

          # Create the release if it does not exist yet.
          #
          # --latest=false is essential: the server tarball OTA resolves
          # github.com/<repo>/releases/latest and downloads
          # pencarimovie-server.tar.gz from that tag. If this rolling APK
          # release were marked "latest" it would shadow the server release
          # and the tarball update would 404.
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --title "$TITLE" \
              --notes "$NOTES" \
              --latest=false
          else
            gh release edit "$TAG" --title "$TITLE" --notes "$NOTES" --latest=false
          fi

          gh release upload "$TAG" \
            dist-apk/pencarimovie_arm64-v8a.apk \
            dist-apk/pencarimovie_arm64-v8a.apk.sha256 \
            dist-apk/version.json \
            --clobber

      # A versioned tag also gets its own APK, attached to the release that
      # release.yml creates for the same tag. This workflow never creates that
      # release itself — doing so would race release.yml and could publish a
      # release without the server tarball, breaking the tarball OTA.
      - name: Attach APK to versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"

          # release.yml runs in parallel and creates the release. Wait for it.
          for i in $(seq 1 20); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              echo "Release $TAG is available"
              break
            fi
            echo "Waiting for release $TAG ($i/20)..."
            sleep 15
          done

          if ! gh release view "$TAG" >/dev/null 2>&1; then
            echo "::warning::Release $TAG was not created by release.yml; skipping APK upload"
            exit 0
          fi

          # Verify the server tarball is present before touching the release.
          # If it is missing, uploading here would leave a release that the
          # tarball OTA cannot use.
          if ! gh release view "$TAG" --json assets --jq '.assets[].name' | grep -q 'pencarimovie-server.tar.gz'; then
            echo "::warning::Release $TAG has no pencarimovie-server.tar.gz yet; skipping APK upload"
            exit 0
          fi

          gh release upload "$TAG" \
            dist-apk/pencarimovie_arm64-v8a.apk \
            dist-apk/pencarimovie_arm64-v8a.apk.sha256 \
            dist-apk/version.json \
            --clobber

          # Never let a versioned APK release become "latest" — the tarball
          # OTA depends on /releases/latest pointing at a server release.
          gh release edit "$TAG" --latest=false
