services:
  pencarimovie:
    image: ghcr.io/aiskendi/pencarimovie-server:latest
    container_name: pencarimovie-server
    restart: unless-stopped
    ports:
      - "${PORT:-8088}:8088"
    environment:
      - PORT=${PORT:-8088}
      - FRANKENPHP_NUM_THREADS=${FRANKENPHP_NUM_THREADS:-16}
      - FRANKENPHP_MAX_THREADS=${FRANKENPHP_MAX_THREADS:-64}
    volumes:
      - ./storage:/app/storage
