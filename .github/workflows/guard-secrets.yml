name: guard-secrets

# The APK signing key and its password were published once (commit 9ec6a2f,
# untracked in 90d2114) and those blobs are still in this repository's history.
# Nothing here can un-publish them: the canonical repo would have to be rewritten
# and every fork is outside our control. This job has one narrower purpose — stop a
# SECOND copy from entering the tree. `android/` is gitignored, so the realistic
# accident is a `git add -f android/` while debugging a release.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signing-material:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: No keystore, no literal signing password
        run: |
          set -eu
          status=0

          while IFS= read -r f; do
            case "$f" in
              *.jks|*.keystore|*.p12|*.pepk)
                echo "::error file=$f::tracked signing material - this must never be committed"
                status=1
                ;;
            esac
          done < <(git ls-files)

          # A literal is a quote immediately after the key name. The build files read
          # `pmSecret('pm.release.storePassword', ...)` instead, which cannot match.
          if git grep -n -I -E "(storePassword|keyPassword)[[:space:]]+['\"][^'\"]{6,}['\"]" -- . ; then
            echo "::error::a literal signing password is tracked - read it from the gitignored local.properties or the environment"
            status=1
          fi

          exit "$status"
