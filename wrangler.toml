name = "pencarimovie-relay"
main = "cloudflare-worker.js"
compatibility_date = "2026-03-01"
workers_dev = false

# Route ONLY tunnel.pencarimovie.com to the Worker.
# All other domains (pencarimovie.com, telegram-webhook.pencarimovie.com, etc.)
# are direct DNS / origin and will NEVER invoke or count towards Worker quota.
routes = [
  { pattern = "tunnel.pencarimovie.com/*", zone_name = "pencarimovie.com" }
]

[[kv_namespaces]]
binding = "TUNNEL_KV"
id = "32a1d6ce76c94d4898c01b08bd5a4025"
